<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة ذكية - Groq</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            background: #0f3460;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #e94560;
            padding: 20px;
            text-align: center;
            color: white;
        }
        
        .header h2 { font-size: 24px; }
        .header p { font-size: 14px; opacity: 0.9; margin-top: 5px; }
        
        #chat {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: #16213e;
        }
        
        .msg {
            margin: 12px 0;
            padding: 14px 18px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user {
            background: #e94560;
            color: white;
            margin-right: auto;
            margin-left: 0;
            border-bottom-right-radius: 4px;
        }
        
        .bot {
            background: #1a1a2e;
            color: #e0e0e0;
            margin-left: auto;
            margin-right: 0;
            border-bottom-left-radius: 4px;
            border: 1px solid #0f3460;
        }
        
        .typing {
            color: #888;
            font-style: italic;
            font-size: 13px;
            margin: 10px 0;
        }
        
        .input-area {
            display: flex;
            padding: 15px;
            background: #0f3460;
            gap: 10px;
        }
        
        #input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 25px;
            background: #1a1a2e;
            color: white;
            font-size: 15px;
            outline: none;
        }
        
        #input::placeholder { color: #888; }
        
        button {
            padding: 14px 24px;
            border: none;
            border-radius: 25px;
            background: #e94560;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover { background: #ff6b6b; transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🤖 دردشة ذكية</h2>
            <p>مدعومة بنموذج Llama 3.1 عبر Groq</p>
        </div>
        
        <div id="chat"></div>
        
        <div class="input-area">
            <input type="text" id="input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>

<script>
let messages = [
    { role: 'system', content: 'أنت مساعد ذكي متعاون. اجب باللغة العربية دائماً ما لم يُطلب منك خلاف ذلك. كن مفيداً وموجزاً.' }
];

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing';
    div.textContent = '... يكتب';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
}

async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    
    addMessage(text, 'user');
    messages.push({ role: 'user', content: text });
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                messages: messages
            })
        });

        hideTyping();

        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || 'خطأ ' + response.status);
        }

        const data = await response.json();
        
        if (!data.candidates || !data.candidates[0]) {
            throw new Error('لم يتم استلام رد');
        }

        const reply = data.candidates[0].content.parts[0].text;
        addMessage(reply, 'bot');
        messages.push({ role: 'assistant', content: reply });

    } catch (error) {
        hideTyping();
        addMessage('❌ حدث خطأ: ' + error.message, 'bot');
        console.error(error);
    } finally {
        sendBtn.disabled = false;
        input.focus();
    }
}

input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

addMessage('مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟', 'bot');
</script>
</body>
</html>
