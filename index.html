<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bara Animate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Bara <span>Animate</span></div>
    <div class="hint">Choose a style, then drag or rotate a body part.</div>
    <button id="resetBtn">Reset pose</button>
  </header>

  <aside class="sidebar">
    <h2>Character</h2>

    <section>
      <h3>Hair</h3>
      <div class="choices">
        <button class="choice selected" data-hair="hair1">Style 1</button>
        <button class="choice" data-hair="hair2">Style 2</button>
      </div>
    </section>

    <section>
      <h3>Shirt</h3>
      <div class="choices">
        <button class="choice selected" data-shirt="shirt1">Blue</button>
        <button class="choice" data-shirt="shirt2">Orange</button>
      </div>
    </section>

    <section class="help">
      <h3>How it works</h3>
      <p>Click a body part to select it.</p>
      <p>Drag it to move.</p>
      <p>Use the circular handle to rotate.</p>
      <p>The character is built from exactly 6 animated parts.</p>
    </section>

    <section class="parts">
      <h3>6 Parts</h3>
      <button data-part="head">Head</button>
      <button data-part="body">Body</button>
      <button data-part="leftArm">Left arm</button>
      <button data-part="rightArm">Right arm</button>
      <button data-part="leftLeg">Left leg</button>
      <button data-part="rightLeg">Right leg</button>
    </section>
  </aside>

  <main class="workspace">
    <div class="toolbar">
      <strong>Canvas</strong>
      <span id="selectedName">No part selected</span>
    </div>
    <div id="stage">
      <svg id="character" viewBox="0 0 600 720" aria-label="Editable cartoon character">
        <defs>
          <g id="headShape">
            <circle cx="300" cy="155" r="108" class="skin"/>
            <circle cx="257" cy="148" r="14" fill="#fff"/><circle cx="257" cy="148" r="7" fill="#111"/>
            <circle cx="343" cy="148" r="14" fill="#fff"/><circle cx="343" cy="148" r="7" fill="#111"/>
            <path d="M282 194 Q300 208 318 194" class="line"/>
          </g>

          <g id="hair1">
            <path d="M205 125 Q205 43 300 40 Q395 43 395 125 L367 105 L348 125 L326 91 L302 125 L272 90 L248 126 L230 105 Z" class="hair"/>
          </g>
          <g id="hair2">
            <path d="M198 132 Q203 43 300 42 Q399 43 402 132 Q370 100 345 108 Q320 75 300 112 Q275 75 250 108 Q225 100 198 132 Z" class="hair"/>
            <path d="M225 92 Q300 28 378 90" class="line"/>
          </g>

          <g id="bodyShape">
            <path d="M228 272 Q300 240 372 272 L395 432 Q300 462 205 432 Z" class="shirt"/>
            <path d="M264 264 Q300 300 336 264" class="line"/>
          </g>

          <g id="leftArmShape">
            <path d="M224 282 Q185 305 178 370 L165 442 Q164 473 191 476 Q215 475 220 449 L239 365 Q245 320 260 292 Z" class="skin"/>
          </g>

          <g id="rightArmShape">
            <path d="M376 282 Q415 305 422 370 L435 442 Q436 473 409 476 Q385 475 380 449 L361 365 Q355 320 340 292 Z" class="skin"/>
          </g>

          <g id="leftLegShape">
            <path d="M232 430 L291 430 L282 585 Q276 615 255 625 L190 625 Q175 618 181 599 L225 575 Z" class="pants"/>
            <path d="M190 625 Q230 605 270 624 L282 651 L173 651 Q164 635 190 625 Z" class="shoe"/>
            <path d="M177 642 H278" class="line"/>
          </g>

          <g id="rightLegShape">
            <path d="M309 430 L368 430 L375 575 L419 599 Q425 618 410 625 L345 625 Q324 615 318 585 Z" class="pants"/>
            <path d="M330 624 Q370 605 410 625 Q436 635 427 651 L318 651 L330 624 Z" class="shoe"/>
            <path d="M322 642 H423" class="line"/>
          </g>
        </defs>

        <g class="part" id="leftLeg" data-label="Left leg" transform="translate(0 0) rotate(0 260 430)">
          <use href="#leftLegShape"/>
        </g>
        <g class="part" id="rightLeg" data-label="Right leg" transform="translate(0 0) rotate(0 340 430)">
          <use href="#rightLegShape"/>
        </g>
        <g class="part" id="leftArm" data-label="Left arm" transform="translate(0 0) rotate(0 240 285)">
          <use href="#leftArmShape"/>
        </g>
        <g class="part" id="rightArm" data-label="Right arm" transform="translate(0 0) rotate(0 360 285)">
          <use href="#rightArmShape"/>
        </g>
        <g class="part" id="body" data-label="Body" transform="translate(0 0) rotate(0 300 350)">
          <use href="#bodyShape"/>
        </g>
        <g class="part" id="head" data-label="Head" transform="translate(0 0) rotate(0 300 260)">
          <use href="#headShape"/>
          <use id="hairUse" href="#hair1"/>
        </g>
      </svg>
      <div id="rotateHandle" hidden title="Drag to rotate"></div>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
